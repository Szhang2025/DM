<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function & Derivative Plotter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.11.0/math.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            max-width: 900px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .input-section {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            font-family: 'Courier New', monospace;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .range-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .range-input {
            display: flex;
            flex-direction: column;
        }

        .range-input input {
            width: 100%;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .chart-container {
            position: relative;
            height: 400px;
            margin-top: 30px;
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            border-left: 4px solid #c33;
            display: none;
        }

        .interpretation {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            border-left: 4px solid #4caf50;
            display: none;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        .interpretation strong {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .examples {
            background: #f0f4ff;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 13px;
        }

        .examples strong {
            color: #667eea;
            display: block;
            margin-bottom: 8px;
        }

        .examples code {
            background: white;
            padding: 2px 6px;
            border-radius: 4px;
            margin: 0 3px;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Function & Derivative Plotter</h1>
        <p class="subtitle">Visualize any single-variable function and its derivative</p>

        <div class="input-section">
            <label for="functionInput">Enter function f(x):</label>
            <input type="text" id="functionInput" placeholder="e.g., x^2, sin(x), x^3 - 2*x" value="x^2">
        </div>

        <div class="range-inputs">
            <div class="range-input">
                <label for="xMin">X min:</label>
                <input type="text" id="xMin" value="-5">
            </div>
            <div class="range-input">
                <label for="xMax">X max:</label>
                <input type="text" id="xMax" value="5">
            </div>
        </div>

        <button onclick="plotFunction()">Plot Function</button>

        <div class="interpretation" id="interpretationMsg"></div>
        <div class="error" id="errorMsg"></div>

        <div class="examples">
            <strong>Example functions (smart notation supported!):</strong>
            <code>x^2</code>
            <code>sinx</code>
            <code>3tanx</code>
            <code>xcosx</code>
            <code>2sin(x)</code>
            <code>x^3 - 2x</code>
            <code>(x+1)(x-1)</code>
            <code>(x-cosx)^(1/3)</code>
        </div>

        <div class="chart-container">
            <canvas id="myChart"></canvas>
        </div>
    </div>

    <script>
        let myChart = null;

        function preprocessFunction(input) {
            let processed = input.trim();
            
            const functions = ['sin', 'cos', 'tan', 'sec', 'csc', 'cot', 'ln', 'log', 'exp', 'sqrt', 'abs', 'asin', 'acos', 'atan'];
            
            // Special handling for patterns like "3tanx" -> need to recognize the function first
            // Pattern: optional number/variable + function name + variable
            functions.forEach(func => {
                // Match: (number or variable)(function)(variable) -> (number or variable)*(function)(variable)
                const regex1 = new RegExp(`([0-9]+)\\s*(${func})\\s*([a-z])(?![a-z])`, 'gi');
                processed = processed.replace(regex1, '$1*$2($3)');
                
                // Match: (variable)(function)(variable) -> (variable)*(function)(variable)
                const regex2 = new RegExp(`([a-z])\\s*(${func})\\s*([a-z])(?![a-z])`, 'gi');
                processed = processed.replace(regex2, '$1*$2($3)');
                
                // Match: just function name followed by variable (without number/var prefix)
                const regex3 = new RegExp(`\\b${func}\\s*([a-z])(?![a-z])`, 'gi');
                processed = processed.replace(regex3, `${func}($1)`);
            });
            
            // Now handle remaining implicit multiplications
            
            // Number or variable followed by function with parentheses: xcos( -> x*cos(, 2sin( -> 2*sin(
            processed = processed.replace(/([0-9a-z])\s*(sin|cos|tan|sec|csc|cot|ln|log|exp|sqrt|abs|asin|acos|atan)\s*\(/gi, '$1*$2(');
            
            // Closing paren followed by opening paren: )( -> )*(
            processed = processed.replace(/\)\s*\(/g, ')*(');
            
            // Number or variable followed by opening paren: 2( -> 2*(, x( -> x*(
            processed = processed.replace(/([0-9a-z])\s*\(/gi, '$1*(');
            
            // Closing paren followed by number or variable: )x -> )*x, )2 -> )*2
            processed = processed.replace(/\)\s*([0-9a-z])/gi, ')*$1');
            
            // Number followed by variable: 2x -> 2*x, 3y -> 3*y
            processed = processed.replace(/([0-9])\s*([a-z])/gi, '$1*$2');
            
            // Variable followed by number: x2 -> x*2
            processed = processed.replace(/([a-z])\s*([0-9])/gi, '$1*$2');
            
            return processed;
        }

        function plotFunction() {
            const rawInput = document.getElementById('functionInput').value;
            const functionInput = preprocessFunction(rawInput);
            const xMin = parseFloat(document.getElementById('xMin').value);
            const xMax = parseFloat(document.getElementById('xMax').value);
            const errorMsg = document.getElementById('errorMsg');
            const interpretationMsg = document.getElementById('interpretationMsg');

            // Clear previous messages
            errorMsg.style.display = 'none';
            interpretationMsg.style.display = 'none';

            // Show interpretation if input was modified
            if (rawInput !== functionInput) {
                interpretationMsg.innerHTML = `<strong>Interpreted as:</strong> ${functionInput}`;
                interpretationMsg.style.display = 'block';
            }

            try {
                // Validate inputs
                if (isNaN(xMin) || isNaN(xMax)) {
                    throw new Error('Please enter valid numbers for X range');
                }
                if (xMin >= xMax) {
                    throw new Error('X min must be less than X max');
                }

                // Parse the function
                const node = math.parse(functionInput);
                const compiled = node.compile();

                // Calculate derivative
                const derivative = math.derivative(functionInput, 'x');
                const derivativeCompiled = derivative.compile();

                // Generate x values
                const numPoints = 200;
                const step = (xMax - xMin) / numPoints;
                const xValues = [];
                const yValues = [];
                const yDerivativeValues = [];

                for (let i = 0; i <= numPoints; i++) {
                    const x = xMin + i * step;
                    xValues.push(x);

                    try {
                        const y = compiled.evaluate({ x: x });
                        // Check if result is a valid real number
                        if (typeof y === 'number' && isFinite(y)) {
                            yValues.push(y);
                        } else if (y && typeof y === 'object' && 're' in y) {
                            // Handle complex numbers - only plot if imaginary part is negligible
                            if (Math.abs(y.im) < 1e-10 && isFinite(y.re)) {
                                yValues.push(y.re);
                            } else {
                                yValues.push(null);
                            }
                        } else {
                            yValues.push(null);
                        }
                    } catch (e) {
                        yValues.push(null);
                    }

                    try {
                        const yDeriv = derivativeCompiled.evaluate({ x: x });
                        // Check if result is a valid real number
                        if (typeof yDeriv === 'number' && isFinite(yDeriv)) {
                            yDerivativeValues.push(yDeriv);
                        } else if (yDeriv && typeof yDeriv === 'object' && 're' in yDeriv) {
                            // Handle complex numbers - only plot if imaginary part is negligible
                            if (Math.abs(yDeriv.im) < 1e-10 && isFinite(yDeriv.re)) {
                                yDerivativeValues.push(yDeriv.re);
                            } else {
                                yDerivativeValues.push(null);
                            }
                        } else {
                            yDerivativeValues.push(null);
                        }
                    } catch (e) {
                        yDerivativeValues.push(null);
                    }
                }

                // Destroy previous chart if exists
                if (myChart) {
                    myChart.destroy();
                }

                // Create new chart
                const ctx = document.getElementById('myChart').getContext('2d');
                myChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: xValues,
                        datasets: [
                            {
                                label: `f(x) = ${rawInput}`,
                                data: yValues,
                                borderColor: 'rgb(102, 126, 234)',
                                backgroundColor: 'rgba(102, 126, 234, 0.1)',
                                borderWidth: 2,
                                pointRadius: 0,
                                tension: 0.1,
                                spanGaps: false
                            },
                            {
                                label: `f'(x) = ${derivative.toString()}`,
                                data: yDerivativeValues,
                                borderColor: 'rgb(118, 75, 162)',
                                backgroundColor: 'rgba(118, 75, 162, 0.1)',
                                borderWidth: 2,
                                pointRadius: 0,
                                tension: 0.1,
                                spanGaps: false
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: true,
                                position: 'top'
                            },
                            tooltip: {
                                mode: 'index',
                                intersect: false
                            }
                        },
                        scales: {
                            x: {
                                type: 'linear',
                                title: {
                                    display: true,
                                    text: 'x'
                                },
                                ticks: {
                                    callback: function(value) {
                                        return value.toFixed(1);
                                    }
                                }
                            },
                            y: {
                                title: {
                                    display: true,
                                    text: 'y'
                                }
                            }
                        },
                        interaction: {
                            mode: 'nearest',
                            axis: 'x',
                            intersect: false
                        }
                    }
                });

            } catch (error) {
                errorMsg.textContent = `Error: ${error.message}`;
                errorMsg.style.display = 'block';
                console.error(error);
            }
        }

        // Plot initial function on load
        window.onload = function() {
            plotFunction();
        };
    </script>
</body>
</html>
